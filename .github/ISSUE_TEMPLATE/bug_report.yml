name: Bug Report
description: Something isn't working as expected
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please fill out as much of this as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A minimal code snippet, or ideally a failing test, that reproduces the issue.
      render: csharp
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: QueryFlow package version(s)
      placeholder: "e.g. QueryFlow.Core 1.2.0, QueryFlow.EFCore 1.2.0"
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: .NET version
      placeholder: "e.g. .NET 10.0"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Data access provider
      options:
        - Entity Framework Core (SQL Server)
        - Entity Framework Core (PostgreSQL)
        - Entity Framework Core (SQLite)
        - Entity Framework Core (MySQL)
        - Entity Framework Core (other)
        - Dapper
        - In-memory / LINQ-to-Objects
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Stack traces, logs, screenshots — anything else relevant.
